name: Update n8n release

on:
  schedule:
    - cron: '23 20 * * *' # Daily at 20:23 UTC (06:23 Brisbane).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-n8n-release
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check the latest stable n8n release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update-n8n-version.py

      - name: Create or update the version pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: codex/update-n8n-version
          delete-branch: true
          add-paths: .env.example
          commit-message: 'chore: update n8n to ${{ steps.release.outputs.version }}'
          title: 'chore: update n8n to ${{ steps.release.outputs.version }}'
          body: |
            Updates `N8N_VERSION` in `.env.example` from `${{ steps.release.outputs.current }}` to `${{ steps.release.outputs.version }}`.

            Source: [n8n release notes](${{ steps.release.outputs.release_url }}).

            Both n8n and its task runners use this version. Review the release notes before merging.
            Existing deployments must update their private `.env` and recreate the containers separately.
